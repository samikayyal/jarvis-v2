[project]
name = "jarvis-v2"
version = "0.1.0"
description = "Single-operator native Ubuntu personal assistant runtime for OpenWA"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai==2.53.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
jarvis-personal-runtime = "jarvis_personal_runtime.service:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "cryptography>=46.0.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
