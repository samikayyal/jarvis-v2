name: jarvis-assistant-v1

x-service-defaults: &service-defaults
  build:
    context: ..
    dockerfile: deployment/Dockerfile
  profiles: [manual-activation]
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
  healthcheck: &healthcheck
    test: [CMD, python, /opt/jarvis/deployment/health_probe.py]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 5m
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "5"

services:
  inbound_receiver:
    <<: *service-defaults
    user: "10001:20000"
    environment:
      JARVIS_SERVICE_IDENTITY: jarvis-inbound
    command: [serve, inbound_receiver]
    volumes:
      - /etc/jarvis/jarvis.toml:/run/jarvis/config.toml:ro
      - /etc/jarvis/credentials/openwa-inbound:/run/credentials/openwa-inbound:ro
      - /etc/jarvis/protocol/inbound_receiver--capability_broker.key:/run/protocol/inbound_receiver--capability_broker.key:ro
    networks: [ingress_broker]
    pids_limit: 32
    deploy:
      resources:
        limits: {memory: 64M, cpus: "0.10", pids: 32}

  capability_broker:
    <<: *service-defaults
    user: "10002:20000"
    environment:
      JARVIS_SERVICE_IDENTITY: jarvis-broker
    command: [serve, capability_broker]
    depends_on:
      deleted_conversation_archive:
        condition: service_healthy
    volumes:
      - /etc/jarvis/jarvis.toml:/run/jarvis/config.toml:ro
      - /etc/jarvis/credentials/broker:/run/credentials/broker:ro
      - /etc/jarvis/protocol/inbound_receiver--capability_broker.key:/run/protocol/inbound_receiver--capability_broker.key:ro
      - /etc/jarvis/protocol/capability_broker--orchestration_agent.key:/run/protocol/capability_broker--orchestration_agent.key:ro
      - /etc/jarvis/protocol/capability_broker--audit_service.key:/run/protocol/capability_broker--audit_service.key:ro
      - /etc/jarvis/protocol/capability_broker--google_connector.key:/run/protocol/capability_broker--google_connector.key:ro
      - /etc/jarvis/protocol/capability_broker--knowledge_vault_connector.key:/run/protocol/capability_broker--knowledge_vault_connector.key:ro
      - /etc/jarvis/protocol/capability_broker--openwa_outbound_connector.key:/run/protocol/capability_broker--openwa_outbound_connector.key:ro
      - /etc/jarvis/protocol/capability_broker--worker_gateway.key:/run/protocol/capability_broker--worker_gateway.key:ro
      - /etc/jarvis/protocol/capability_broker--deleted_conversation_archive.key:/run/protocol/capability_broker--deleted_conversation_archive.key:ro
      - /var/lib/jarvis/state:/var/lib/jarvis/state
      - /var/lib/jarvis/traces:/var/lib/jarvis/traces
      - /run/jarvis/deleted-archive-ipc:/run/jarvis-deleted
    networks:
      - ingress_broker
      - broker_orchestration
      - broker_audit
      - broker_google
      - broker_vault
      - broker_openwa_outbound
      - broker_worker
    pids_limit: 32
    deploy:
      resources:
        limits: {memory: 144M, cpus: "0.25", pids: 32}

  orchestration_agent:
    <<: *service-defaults
    user: "10003:20000"
    environment:
      JARVIS_SERVICE_IDENTITY: jarvis-orchestration
      HTTPS_PROXY: http://orchestration_egress_proxy:9080
      HTTP_PROXY: http://orchestration_egress_proxy:9080
      NO_PROXY: capability_broker,google_connector,knowledge_vault_connector,127.0.0.1,localhost
    command: [serve, orchestration_agent]
    volumes:
      - /etc/jarvis/jarvis.toml:/run/jarvis/config.toml:ro
      - /etc/jarvis/credentials/openai:/run/credentials/openai:ro
      - /etc/jarvis/protocol/capability_broker--orchestration_agent.key:/run/protocol/capability_broker--orchestration_agent.key:ro
      - /etc/jarvis/protocol/orchestration_agent--google_connector.key:/run/protocol/orchestration_agent--google_connector.key:ro
      - /etc/jarvis/protocol/orchestration_agent--knowledge_vault_connector.key:/run/protocol/orchestration_agent--knowledge_vault_connector.key:ro
    networks: [broker_orchestration, broker_google, broker_vault, orchestration_egress]
    pids_limit: 112
    deploy:
      resources:
        limits: {memory: 224M, cpus: "0.42", pids: 112}

  audit_service:
    <<: *service-defaults
    user: "10004:20000"
    environment:
      JARVIS_SERVICE_IDENTITY: jarvis-audit
    command: [serve, audit_service]
    volumes:
      - /etc/jarvis/jarvis.toml:/run/jarvis/config.toml:ro
      - /var/lib/jarvis/audit:/var/lib/jarvis/audit
      - /etc/jarvis/protocol/capability_broker--audit_service.key:/run/protocol/capability_broker--audit_service.key:ro
      - /etc/jarvis/protocol/google_connector--audit_service.key:/run/protocol/google_connector--audit_service.key:ro
    networks: [broker_audit]
    pids_limit: 32
    deploy:
      resources:
        limits: {memory: 64M, cpus: "0.10", pids: 32}

  google_connector:
    <<: *service-defaults
    user: "10005:20000"
    environment:
      JARVIS_SERVICE_IDENTITY: jarvis-google
      HTTPS_PROXY: http://google_egress_proxy:9080
      HTTP_PROXY: http://google_egress_proxy:9080
      NO_PROXY: capability_broker,audit_service,public_oauth_callback,127.0.0.1,localhost
    command: [serve, google_connector]
    volumes:
      - /etc/jarvis/jarvis.toml:/run/jarvis/config.toml:ro
      - /etc/jarvis/credentials/google:/run/credentials/google
      - /etc/jarvis/protocol/capability_broker--google_connector.key:/run/protocol/capability_broker--google_connector.key:ro
      - /etc/jarvis/protocol/orchestration_agent--google_connector.key:/run/protocol/orchestration_agent--google_connector.key:ro
      - /etc/jarvis/protocol/public_oauth_callback--google_connector.key:/run/protocol/public_oauth_callback--google_connector.key:ro
      - /etc/jarvis/protocol/google_connector--audit_service.key:/run/protocol/google_connector--audit_service.key:ro
      - /var/lib/jarvis/google-traces:/var/lib/jarvis/google-traces
    networks: [broker_google, broker_audit, oauth_google, google_egress]
    pids_limit: 48
    deploy:
      resources:
        limits: {memory: 64M, cpus: "0.12", pids: 48}

  knowledge_vault_connector:
    <<: *service-defaults
    user: "10006:20000"
    environment:
      JARVIS_SERVICE_IDENTITY: jarvis-vault
    command: [serve, knowledge_vault_connector]
    volumes:
      - /etc/jarvis/jarvis.toml:/run/jarvis/config.toml:ro
      - /etc/jarvis/credentials/vault:/run/credentials/vault:ro
      - /etc/jarvis/protocol/capability_broker--knowledge_vault_connector.key:/run/protocol/capability_broker--knowledge_vault_connector.key:ro
      - /etc/jarvis/protocol/orchestration_agent--knowledge_vault_connector.key:/run/protocol/orchestration_agent--knowledge_vault_connector.key:ro
      - /var/lib/jarvis/vault:/var/lib/jarvis/vault
    networks: [broker_vault, vault_egress]
    pids_limit: 48
    deploy:
      resources:
        limits: {memory: 96M, cpus: "0.17", pids: 48}

  openwa_outbound_connector:
    <<: *service-defaults
    user: "10007:20000"
    environment:
      JARVIS_SERVICE_IDENTITY: jarvis-openwa-outbound
    command: [serve, openwa_outbound_connector]
    volumes:
      - /etc/jarvis/jarvis.toml:/run/jarvis/config.toml:ro
      - /etc/jarvis/credentials/openwa:/run/credentials/openwa:ro
      - /etc/jarvis/protocol/capability_broker--openwa_outbound_connector.key:/run/protocol/capability_broker--openwa_outbound_connector.key:ro
    networks: [broker_openwa_outbound, openwa_api]
    pids_limit: 32
    deploy:
      resources:
        limits: {memory: 64M, cpus: "0.10", pids: 32}

  worker_gateway:
    <<: *service-defaults
    user: "10008:20000"
    environment:
      JARVIS_SERVICE_IDENTITY: jarvis-worker-gateway
    command: [serve, worker_gateway]
    volumes:
      - /etc/jarvis/jarvis.toml:/run/jarvis/config.toml:ro
      - /etc/jarvis/credentials/windows-worker:/run/credentials/windows-worker:ro
      - /etc/jarvis/protocol/capability_broker--worker_gateway.key:/run/protocol/capability_broker--worker_gateway.key:ro
      - /run/jarvis-worker/ubuntu.sock:/run/jarvis-worker/ubuntu.sock:ro
    networks: [broker_worker, worker_overlay]
    expose: ["9443"]
    pids_limit: 64
    deploy:
      resources:
        limits: {memory: 96M, cpus: "0.25", pids: 64}

  public_oauth_callback:
    <<: *service-defaults
    user: "10009:20000"
    environment:
      JARVIS_SERVICE_IDENTITY: jarvis-oauth-callback
    command: [serve, public_oauth_callback]
    volumes:
      - /etc/jarvis/jarvis.toml:/run/jarvis/config.toml:ro
      - /etc/jarvis/protocol/public_oauth_callback--google_connector.key:/run/protocol/public_oauth_callback--google_connector.key:ro
    networks: [oauth_google]
    ports: ["127.0.0.1:8080:8080"]
    pids_limit: 32
    deploy:
      resources:
        limits: {memory: 48M, cpus: "0.10", pids: 32}

  deleted_conversation_archive:
    <<: *service-defaults
    user: "10010:20000"
    environment:
      JARVIS_SERVICE_IDENTITY: jarvis-deleted-archive
    command: [serve, deleted_conversation_archive]
    volumes:
      - /etc/jarvis/jarvis.toml:/run/jarvis/config.toml:ro
      - /etc/jarvis/protocol/capability_broker--deleted_conversation_archive.key:/run/protocol/capability_broker--deleted_conversation_archive.key:ro
      - /var/lib/jarvis/deleted-conversations:/var/lib/jarvis/deleted-conversations
      - /run/jarvis/deleted-archive-ipc:/run/jarvis-deleted
    network_mode: none
    pids_limit: 32
    deploy:
      resources:
        limits: {memory: 48M, cpus: "0.10", pids: 32}

  orchestration_egress_proxy:
    <<: *service-defaults
    user: "10011:20000"
    environment:
      JARVIS_SERVICE_IDENTITY: jarvis-orchestration-egress
    command: [serve-egress-proxy, orchestration]
    volumes:
      - /etc/jarvis/jarvis.toml:/run/jarvis/config.toml:ro
    networks: [orchestration_egress, external_egress]
    healthcheck:
      <<: *healthcheck
      test: [CMD, python, /opt/jarvis/deployment/health_probe.py]
      start_period: 10m
      start_interval: 30s
    pids_limit: 16
    deploy:
      resources:
        limits: {memory: 48M, cpus: "0.03", pids: 16}

  google_egress_proxy:
    <<: *service-defaults
    user: "10012:20000"
    environment:
      JARVIS_SERVICE_IDENTITY: jarvis-google-egress
    command: [serve-egress-proxy, google]
    volumes:
      - /etc/jarvis/jarvis.toml:/run/jarvis/config.toml:ro
    networks: [google_egress, external_egress]
    healthcheck:
      <<: *healthcheck
      test: [CMD, python, /opt/jarvis/deployment/health_probe.py]
      start_period: 10m
      start_interval: 30s
    pids_limit: 16
    deploy:
      resources:
        limits: {memory: 48M, cpus: "0.03", pids: 16}

  vault_egress_proxy:
    <<: *service-defaults
    user: "10013:20000"
    environment:
      JARVIS_SERVICE_IDENTITY: jarvis-vault-egress
    command: [serve-egress-proxy, vault]
    volumes:
      - /etc/jarvis/jarvis.toml:/run/jarvis/config.toml:ro
    networks: [vault_egress, external_egress]
    healthcheck:
      <<: *healthcheck
      test: [CMD, python, /opt/jarvis/deployment/health_probe.py]
      start_period: 10m
      start_interval: 30s
    pids_limit: 16
    deploy:
      resources:
        limits: {memory: 48M, cpus: "0.03", pids: 16}

networks:
  ingress_broker: {internal: true}
  broker_orchestration: {internal: true}
  broker_audit: {internal: true}
  broker_google: {internal: true}
  broker_vault: {internal: true}
  broker_openwa_outbound: {internal: true}
  broker_worker: {internal: true}
  oauth_google: {internal: true}
  orchestration_egress: {internal: true}
  google_egress: {internal: true}
  vault_egress: {internal: true}
  external_egress: {internal: false}
  openwa_api: {external: true, name: jarvis-openwa-api}
  worker_overlay: {external: true, name: jarvis-worker-overlay}
